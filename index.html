<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Segundo Cerebro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">

        <aside class="sidebar">
            <div class="perfil">
                <img src="https://via.placeholder.com/80" alt="Foto de perfil" class="avatar">
                <h2>Daniela</h2>
                <p class="score">⭐ Score 57/100</p>
            </div>
            
            <nav class="menu">
                <ul>
                    <li class="activo">🏠 Inicio</li>
                    <li>📝 Posts</li>
                    <li>📈 Constancia</li>
                    <li>💡 Ideas IA</li>
                    <li>🤖 Asistente</li>
                    </ul>
            </nav>
        </aside>

        <main class="main-content">
            <header class="header">
                <h1>Buenos días Daniela 👋</h1>
                <p class="fecha">lunes, 27 de abril</p>
            </header>

            <section class="dashboard-widgets">
                <div class="widget destacado">
                    <h3>🔥 Tu último post está rompiendo</h3>
                    <p>737.8K vistas en Instagram - 125% sobre tu promedio</p>
                </div>
            </section>
            
            <div class="zona-pruebas-json">
                <button onclick="guardarDatosDePrueba()">Guardar Datos de Prueba</button>
                <button onclick="descargarJSON()">Exportar mi Data (JSON)</button>
            </div>
        </main>

    </div>

    <script src="storage.js"></script>
</body>
</html>
