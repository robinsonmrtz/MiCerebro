<!DOCTYPE html>
<html lang="es">
<head>

<body>

    <div class="app-container">

<!-- 1. BARRA LATERAL (SIDEBAR) -->
        <aside class="sidebar">

                    <li class="activo" data-target="inicio">🏠 Inicio</li>

                    <li data-target="habitos">✅ Hábitos</li>

                    <li>🏋️ Gimnasio</li>

        <main id="contenedor-vistas" class="main-content">
        </main>

    </div>

    <!-- Conectamos nuestros scripts en orden -->
