<div class="habitos-header">
    <div class="seccion-titulo">
        <h2>✅ Sistema de Hábitos</h2>
        <p>Disciplina diaria y organización.</p>
    </div>
    <div class="calendario-contenedor">
        <button class="nav-cal" onclick="window.moverCalendario(-1)">❮</button>
        <div class="calendario-slider" id="calendario-habitos"></div>
        <button class="nav-cal" onclick="window.moverCalendario(1)">❯</button>
    </div>
</div>

<div style="display: flex; gap: 12px; margin-bottom: 25px;">
    <button onclick="window.abrirModalHabitoNueva()" class="btn-primario">➕ Nuevo Hábito</button>
    <button onclick="window.abrirGestionGrupos()" class="btn-secundario">📁 Grupos</button>
</div>

<div class="habitos-contenedor" id="lista-habitos"></div>

<div id="modal-habito-principal" class="modal-overlay">
    <div class="modal-caja modal-ancho">
        <h3 id="modal-titulo">Configurar Hábito</h3>
        <div class="form-grid">
            <input type="hidden" id="habito-id-edit">
            <label>Nombre del Hábito
                <input type="text" id="habito-nombre" class="input-minimalista" placeholder="Ej. Meditar">
            </label>
            <div class="fila-form">
                <label>Icono <input type="text" id="habito-icono" class="input-minimalista" value="✨"></label>
                <label>Color <input type="color" id="habito-color" class="color-picker-moderno" value="#1A73E8"></label>
            </div>
            <label>Categoría / Grupo 
                <select id="habito-grupo-select" class="input-minimalista"></select>
            </label>
            <label>Tipo de Hábito
                <select id="habito-tipo" class="input-minimalista" onchange="window.alternarCamposTipo()">
                    <option value="contador">Contador (Meta diaria)</option>
                    <option value="cronometro">Cronómetro (Racha de tiempo)</option>
                </select>
            </label>
            <div id="seccion-metas" class="form-grupo-interno-hab">
                <div class="fila-form">
                    <label>Meta diaria <input type="number" id="habito-meta" class="input-minimalista" value="1"></label>
                    <label>Incremento <input type="number" id="habito-paso" class="input-minimalista" value="1"></label>
                </div>
            </div>
        </div>
        <div class="modal-botones-row">
            <button onclick="window.cerrarModalHabito()" class="btn-secundario">Cancelar</button>
            <button id="btn-guardar-habito-accion" class="btn-primario">Guardar Cambios</button>
        </div>
    </div>
</div>

<div id="modal-grupos-gestion" class="modal-overlay">
    <div class="modal-caja modal-ancho">
        <h3>📂 Categorías</h3>
        <div class="card-crear-grupo">
            <label style="font-size:12px; font-weight:bold; color:#555; display:block; margin-bottom:8px;">NUEVO GRUPO</label>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="nuevo-grupo-nombre" class="input-minimalista" placeholder="Nombre (Ej: Mañana 🌅)" style="flex:1">
                <input type="color" id="nuevo-grupo-color" class="color-picker-moderno" value="#1A73E8">
            </div>
            <div id="paleta-sugerida" style="display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap;"></div>
            <button onclick="window.agregarGrupo()" class="btn-primario" style="width: 100%; margin-top: 15px;">Crear Categoría</button>
        </div>
        
        <label style="font-size:12px; font-weight:bold; color:#555; display:block; margin-bottom:10px;">TUS GRUPOS</label>
        <div id="lista-gestion-grupos" style="max-height: 200px; overflow-y: auto; margin-bottom:20px;"></div>
        
        <div class="modal-botones-row">
            <button onclick="window.cerrarGestionGrupos()" class="btn-secundario" style="width:100%">Cerrar</button>
        </div>
    </div>
</div>

<div id="modal-accion-habito-ui" class="modal-overlay">
    <div class="modal-caja modal-transparente">
        <div class="opciones-esquina">
            <div class="habito-opciones">
                <button class="btn-puntos" onclick="window.toggleOpcionesAccion()">⋮</button>
                <div id="dropdown-accion" class="dropdown-opciones">
                    <button onclick="window.editarDesdeAccion()">✏️ Editar</button>
                    <button onclick="window.borrarDesdeAccion()" style="color:red">🗑️ Eliminar</button>
                </div>
            </div>
            <button class="btn-cerrar-limpio" onclick="window.cerrarModalAccion()">✕</button>
        </div>
        <h3 id="accion-titulo"></h3>
        <p id="accion-subtitulo" style="color:#888; margin-bottom: 20px;"></p>
        
        <div id="ui-contador-hab">
            <div class="accion-controles" style="display:flex; align-items:center; justify-content:center; gap:20px; margin-bottom:30px;">
                <button class="btn-redondo" onclick="window.modificarProgreso(-1)">-</button>
                <div class="circulo-progreso-grande" id="accion-circulo">
                    <div id="accion-icono-display"></div>
                </div>
                <button class="btn-redondo" onclick="window.modificarProgreso(1)">+</button>
            </div>
            <button class="btn-primario" style="width:100%;" onclick="window.modificarProgreso(0, true)">Marcar como Completado</button>
        </div>

        <div id="ui-cronometro-hab" style="display:none; text-align:center;">
            <div style="font-size:60px;">⏱️</div>
            <div id="cronometro-modal-display" style="font-size:32px; color:#E74C3C; margin:20px 0; font-weight:bold; font-family:monospace;">0d 00h 00m 00s</div>
            <button onclick="window.reiniciarCronometroConfirmado()" class="btn-reiniciar-racha">Reiniciar Racha</button>
        </div>
    </div>
</div>

<div id="modal-confirmar-habito-borrar" class="modal-overlay">
    <div class="modal-caja">
        <h3>¿Eliminar Hábito?</h3>
        <p>Se perderá todo el historial.</p>
        <div class="modal-botones-row" style="margin-top:20px;">
            <button onclick="document.getElementById('modal-confirmar-habito-borrar').style.display='none'" class="btn-secundario">Cancelar</button>
            <button id="btn-borrar-final" class="btn-primario" style="background:#e74c3c">Sí, eliminar</button>
        </div>
    </div>
</div>
