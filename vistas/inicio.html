<div class="ini-header">
    <div class="seccion-titulo">
        <div class="ini-meta-row">
            <p id="ini-fecha-hoy"></p>
            <span id="ini-dolar-pill">Cargando...</span>
        </div>
        <h2 id="ini-saludo">👋 Hola</h2>
        <p class="ini-subtitulo">Centro de mandos · trabajo, hábitos y finanzas</p>
    </div>

    <div class="ini-controls-wrapper">
        <div class="ini-switch-container">
            <button class="ini-btn-switch" onclick="fz_navegarMes(-1)">◀</button>
            <span id="ini-mes-filtro-label"></span>
            <button class="ini-btn-switch" onclick="fz_navegarMes(1)">▶</button>
        </div>
    </div>
</div>

<div class="ini-dashboard-grid">

    <!-- FINANZAS -->
    <div class="ini-card ini-card-finanzas">
        <div class="ini-card-header">
            <span class="ini-card-icon-wrap">💰</span>
            <span class="ini-card-title">Dinero</span>
            <span id="ini-finanzas-badge" class="ini-badge">--</span>
        </div>
        <div class="ini-card-body">
            <h3 id="ini-finanzas-monto">$0.00</h3>
            <span id="ini-finanzas-promedio" class="ini-card-meta">Promedio Histórico: --</span>
        </div>
        <div class="ini-sparkline-container">
            <canvas id="ini-chart-finanzas"></canvas>
        </div>
    </div>

    <!-- PRODUCTIVIDAD -->
    <div class="ini-card">
        <div class="ini-card-header">
            <span class="ini-card-icon-wrap">🔥</span>
            <span class="ini-card-title">Productividad</span>
            <span id="ini-trabajo-badge" class="ini-badge">--</span>
        </div>
        <div class="ini-card-body">
            <h3 id="ini-trabajo-horas">0.0h</h3>
            <span id="ini-trabajo-promedio" class="ini-card-meta">Promedio Diario: 0.0h/día</span>
        </div>
        <div class="ini-sparkline-container">
            <canvas id="ini-chart-productividad"></canvas>
        </div>
    </div>

    <!-- CONSISTENCIA -->
    <div class="ini-card ini-card-sm">
        <div class="ini-card-header">
            <span class="ini-card-icon-wrap">⚡</span>
            <span class="ini-card-title">Consistencia</span>
        </div>
        <div class="ini-card-body">
            <h3 id="ini-habitos-porcentaje">0%</h3>
            <span class="ini-card-sub">Hábitos completados</span>
        </div>
        <div class="ini-placeholder-bar">
            <div class="ini-bar-fill" style="width: 80%;"></div>
        </div>
    </div>

    <!-- PROYECTOS -->
    <div class="ini-card ini-card-sm">
        <div class="ini-card-header">
            <span class="ini-card-icon-wrap">💼</span>
            <span class="ini-card-title">Proyectos</span>
        </div>
        <div class="ini-card-body">
            <h3 id="ini-clientes-count">0</h3>
            <span class="ini-card-sub">Clientes activos</span>
        </div>
    </div>

</div>
