<div class="cal-header-global">
    <div class="cal-nav-fechas">
        <button class="nav-cal" onclick="window.cambiarPeriodo(-1)">❮</button>
        <div class="cal-fecha-display" onclick="document.getElementById('cal-input-fecha-oculto').showPicker()">
            <span id="cal-titulo-periodo">Julio 2026</span>
            <input type="date" id="cal-input-fecha-oculto" onchange="window.irAFechaCalendario(this.value)">
        </div>
        <button class="nav-cal" onclick="window.cambiarPeriodo(1)">❯</button>
        <button class="btn-ghost" onclick="window.irAHoyCalendario()">Hoy</button>
    </div>

    <div class="cal-header-derecha">
        <div class="cal-selector-vista" id="cal-selector-vista">
            <button type="button" class="vista-btn" data-vista="dia" onclick="window.cambiarVista('dia')">Día</button>
            <button type="button" class="vista-btn" data-vista="semana" onclick="window.cambiarVista('semana')">Semana</button>
            <button type="button" class="vista-btn" data-vista="mes" onclick="window.cambiarVista('mes')">Mes</button>
        </div>
        <button class="btn-primario" onclick="window.abrirModalEvento()">+ Crear evento</button>
    </div>
</div>

<div class="calendario-layout">

    <!-- MINI CALENDARIO DE NAVEGACIÓN -->
    <div class="cal-sidebar-mini">
        <div class="mini-cal-card">
            <div class="mini-cal-nav">
                <span id="mini-cal-mes-anio">Julio 2026</span>
                <div class="mini-cal-arrows">
                    <button type="button" class="mini-cal-arrow" onclick="window.miniCalCambiarMes(-1)">❮</button>
                    <button type="button" class="mini-cal-arrow" onclick="window.miniCalCambiarMes(1)">❯</button>
                </div>
            </div>
            <div class="mini-cal-dias-nombres">
                <span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span>
            </div>
            <div class="mini-cal-grid" id="mini-cal-grid"></div>
        </div>
    </div>

    <div class="cal-main-calendario">

        <!-- VISTAS DÍA / SEMANA (comparten la misma línea de tiempo) -->
        <div id="vista-timeline-container">
            <div class="cal-cabecera-columnas" id="cal-cabecera-columnas"></div>
            <div class="cal-grid-wrapper">
                <div class="cal-timeline">
                    <div class="cal-horas" id="cal-columna-horas"></div>
                    <div class="cal-columnas-zona" id="cal-columnas-zona"></div>
                </div>
            </div>
        </div>

        <!-- VISTA MES -->
        <div class="cal-mes-wrapper" id="vista-mes-container" style="display:none;">
            <div class="cal-mes-dias-nombres">
                <span>LUN</span><span>MAR</span><span>MIÉ</span><span>JUE</span><span>VIE</span><span>SÁB</span><span>DOM</span>
            </div>
            <div class="cal-mes-grid" id="cal-mes-grid"></div>
        </div>

    </div>
</div>

<!-- MODAL -->
<div id="modal-evento-cal" class="modal-overlay">
    <div class="modal-caja">

        <div class="modal-topbar">
            <span class="modal-topbar-title" id="modal-ev-titulo-cabecera">Evento</span>
            <button class="modal-btn-cerrar" onclick="document.getElementById('modal-evento-cal').classList.remove('activo')">×</button>
        </div>

        <div class="modal-body">
            <input type="hidden" id="modal-ev-id">
            <input type="hidden" id="modal-ev-fecha">

            <input
                type="text"
                id="modal-ev-titulo"
                class="modal-ev-titulo-input"
                placeholder="Añadir título"
            >

            <div class="modal-time-row">
                <input type="time" id="modal-ev-inicio" class="input-base">
                <span class="modal-time-sep">→</span>
                <input type="time" id="modal-ev-fin" class="input-base">
            </div>

            <span class="modal-field-label">Repetir</span>
            <select id="modal-ev-repetir" class="input-base select-repetir" onchange="window.actualizarPanelRepeticion()">
                <option value="no">No se repite</option>
                <option value="diaria">Cada día</option>
                <option value="semanal">Cada semana</option>
                <option value="mensual">Cada mes (mismo día)</option>
            </select>

            <div id="panel-dias-semana" class="panel-dias-semana" style="display:none;">
                <span class="modal-field-label">¿Qué días?</span>
                <div class="dias-semana-toggle" id="dias-semana-toggle">
                    <button type="button" class="dia-toggle-btn" data-dia="1">L</button>
                    <button type="button" class="dia-toggle-btn" data-dia="2">M</button>
                    <button type="button" class="dia-toggle-btn" data-dia="3">X</button>
                    <button type="button" class="dia-toggle-btn" data-dia="4">J</button>
                    <button type="button" class="dia-toggle-btn" data-dia="5">V</button>
                    <button type="button" class="dia-toggle-btn" data-dia="6">S</button>
                    <button type="button" class="dia-toggle-btn" data-dia="0">D</button>
                </div>
                <button type="button" class="link-btn" onclick="window.marcarTodosLosDias()">Todos los días</button>
            </div>

            <span class="modal-field-label">Color</span>
            <div class="paleta-wrap" id="paleta-evento"></div>
            <input type="hidden" id="modal-ev-color" value="#4f46e5">
        </div>

        <div class="modal-footer">
            <button id="btn-borrar-ev" class="btn-borrar" onclick="window.borrarEvento()">
                🗑 Eliminar
            </button>
            <div class="modal-acciones">
                <button class="btn-secundario" onclick="document.getElementById('modal-evento-cal').classList.remove('activo')">Cancelar</button>
                <button class="btn-primario" onclick="window.guardarEvento()">Guardar</button>
            </div>
        </div>

    </div>
</div>
